[package]
name = "flash-mark"
version = "0.1.0"
description = "FlashMark Markdown Editor"
authors = ["FlashMark"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "flash_mark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "../src/lib.rs"

[[bin]]
name = "flash-mark"
path = "../src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
